<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opace AI Content Integrity</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="../assets/icon-48.png" alt=""><div><p>Opace evidence desk</p><h1>AI Content Integrity</h1></div></header>
  <main>
    <p class="lede">Selected, visible-article or pasted content is processed locally only after you choose an action. Nothing is sent to Opace.</p>
    <button id="selection"><span>01</span><strong>Check selected text</strong><small>Only your current selection</small></button>
    <button id="article"><span>02</span><strong>Preview this article</strong><small>Confirm before inspection</small></button>
    <button id="paste"><span>03</span><strong>Paste text</strong><small>No page access needed</small></button>
    <section aria-labelledby="engine-title"><b id="engine-title">Local engine</b><strong>Unavailable</strong><p>Pairing is not in the frozen local API. Browser inspection still works.</p></section>
    <p id="status" role="status" aria-live="polite">Nothing has left this browser.</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
