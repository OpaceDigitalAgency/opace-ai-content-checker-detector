<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 476" width="860" height="476" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">SynthID-Text demo: a watermark only shows up under its own key</title>
<desc id="d">Grouped bar chart of mean g-value. Four passages, each scored under all three public demo keys. The passage watermarked with key alpha scores 0.6807 under alpha but collapses to 0.4987 under beta and 0.4869 under gamma. The passage watermarked with beta scores 0.6701 under beta and about 0.50 under the others. The passage watermarked with gamma scores 0.6400 under gamma and about 0.50 under the others. Unwatermarked text scores 0.5077, 0.5091 and 0.5105 under the three keys, sitting on the 0.5 chance line. Detection is evidence about a specific private key, not a universal AI stamp. Sample: 4 of the 24 fixtures are plotted, and the unwatermarked group is a single fixture (uw-250-01), not the eight unwatermarked fixtures. Across all eight the spread is 0.4756 to 0.5264, and across the twelve watermarked passages scored under a wrong key it is 0.4693 to 0.5222, both wider than any bar shown. The fixture corpus is seed-selected: global seed 20260827, up to 12 candidate seeds per fixture, accepted within a stated tolerance band.</desc><text x="0" y="26" font-size="16" font-weight="700" text-anchor="start" fill="#6e7781" fill-opacity="1">A watermark only shows up under its own key</text><text x="0" y="47" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">SynthID-Text mean g-value · @opace/watermark-lab public demo keys alpha, beta, gamma · packages/watermark-lab/fixtures/reference-scores.json</text><rect x="0" y="62" width="11" height="11" fill="#2f81f7" rx="2"/><text x="17" y="72" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">scored under alpha</text><rect x="166" y="62" width="11" height="11" fill="#a371f7" rx="2"/><text x="183" y="72" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">scored under beta</text><rect x="325" y="62" width="11" height="11" fill="#9198a1" rx="2"/><text x="342" y="72" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">scored under gamma</text><line x1="491" y1="68" x2="509" y2="68" stroke="#d29922" stroke-width="2" stroke-dasharray="5 4"/><text x="515" y="72" font-size="12" font-weight="600" text-anchor="start" fill="#d29922" fill-opacity="1">0.500 — chance line, no watermark evidence</text><line x1="64" y1="325.8" x2="836" y2="325.8" stroke="#6e7781" stroke-opacity="0.28"/><text x="54" y="329.7857142857143" font-size="11" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.95">0.45</text><line x1="64" y1="284.7" x2="836" y2="284.7" stroke="#6e7781" stroke-opacity="0.28"/><text x="54" y="288.7142857142857" font-size="11" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.95">0.50</text><line x1="64" y1="243.6" x2="836" y2="243.6" stroke="#6e7781" stroke-opacity="0.28"/><text x="54" y="247.6428571428571" font-size="11" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.95">0.55</text><line x1="64" y1="202.6" x2="836" y2="202.6" stroke="#6e7781" stroke-opacity="0.28"/><text x="54" y="206.57142857142847" font-size="11" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.95">0.60</text><line x1="64" y1="161.5" x2="836" y2="161.5" stroke="#6e7781" stroke-opacity="0.28"/><text x="54" y="165.4999999999999" font-size="11" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.95">0.65</text><line x1="64" y1="120.4" x2="836" y2="120.4" stroke="#6e7781" stroke-opacity="0.28"/><text x="54" y="124.42857142857127" font-size="11" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.95">0.70</text><line x1="64" y1="284.7" x2="836" y2="284.7" stroke="#d29922" stroke-width="2" stroke-dasharray="5 4"/><rect x="85.5" y="136.3" width="46.0" height="197.7" fill="#2f81f7" fill-opacity="1" rx="1.5"/><text x="108.5" y="130.28214285714284" font-size="11" font-weight="700" text-anchor="middle" fill="#6e7781" fill-opacity="1">0.6807</text><rect x="137.5" y="285.8" width="46.0" height="48.2" fill="#a371f7" fill-opacity="0.5" rx="1.5"/><text x="160.5" y="299.78214285714284" font-size="11" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">0.4987</text><rect x="189.5" y="295.5" width="46.0" height="38.5" fill="#9198a1" fill-opacity="0.5" rx="1.5"/><text x="212.5" y="309.475" font-size="11" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">0.4869</text><text x="160.5" y="354" font-size="12.5" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">watermarked with key alpha</text><text x="160.5" y="370" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.9">393 tokens scored</text><rect x="278.5" y="281.5" width="46.0" height="52.5" fill="#2f81f7" fill-opacity="0.5" rx="1.5"/><text x="301.5" y="275.51071428571424" font-size="11" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">0.5039</text><rect x="330.5" y="145.0" width="46.0" height="189.0" fill="#a371f7" fill-opacity="1" rx="1.5"/><text x="353.5" y="138.98928571428567" font-size="11" font-weight="700" text-anchor="middle" fill="#6e7781" fill-opacity="1">0.6701</text><rect x="382.5" y="277.6" width="46.0" height="56.4" fill="#9198a1" fill-opacity="0.5" rx="1.5"/><text x="405.5" y="271.65" font-size="11" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">0.5086</text><text x="353.5" y="354" font-size="12.5" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">watermarked with key beta</text><text x="353.5" y="370" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.9">389 tokens scored</text><rect x="471.5" y="281.9" width="46.0" height="52.1" fill="#2f81f7" fill-opacity="0.5" rx="1.5"/><text x="494.5" y="275.9214285714286" font-size="11" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">0.5034</text><rect x="523.5" y="290.8" width="46.0" height="43.2" fill="#a371f7" fill-opacity="0.5" rx="1.5"/><text x="546.5" y="304.79285714285714" font-size="11" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">0.4926</text><rect x="575.5" y="169.7" width="46.0" height="164.3" fill="#9198a1" fill-opacity="1" rx="1.5"/><text x="598.5" y="163.7142857142857" font-size="11" font-weight="700" text-anchor="middle" fill="#6e7781" fill-opacity="1">0.6400</text><text x="546.5" y="354" font-size="12.5" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">watermarked with key gamma</text><text x="546.5" y="370" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.9">294 tokens scored</text><rect x="664.5" y="278.4" width="46.0" height="55.6" fill="#2f81f7" fill-opacity="0.5" rx="1.5"/><text x="687.5" y="272.3892857142857" font-size="11" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">0.5077</text><rect x="716.5" y="277.2" width="46.0" height="56.8" fill="#a371f7" fill-opacity="0.5" rx="1.5"/><text x="739.5" y="271.2392857142857" font-size="11" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">0.5091</text><rect x="768.5" y="276.1" width="46.0" height="57.9" fill="#9198a1" fill-opacity="0.5" rx="1.5"/><text x="791.5" y="270.0892857142858" font-size="11" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">0.5105</text><text x="739.5" y="354" font-size="12.5" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">not watermarked at all</text><text x="739.5" y="370" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.9">237 tokens scored</text><line x1="64" y1="334.0" x2="836" y2="334.0" stroke="#6e7781" stroke-opacity="0.6"/><text x="14" y="219" transform="rotate(-90 14 219)" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="1">mean g-value</text><text x="430" y="416" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="1">Filled bars are the key the passage was actually generated with. The other two are wrong keys.</text><text x="430" y="436" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="1">Sample: 4 of 24 fixtures. The unwatermarked group is one fixture (uw-250-01), not the eight.</text><text x="430" y="451" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="1">Full spreads are wider — 0.4756–0.5264 unwatermarked, 0.4693–0.5222 wrong-key (n = 24 each).</text><text x="430" y="466" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="1">Corpus is seed-selected (seed 20260827, up to 12 seeds each). Limits: docs/WATERMARK-LAB.md</text></svg>
