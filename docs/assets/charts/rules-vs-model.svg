<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The 113 hand-written writing rules against the trained cycle-2 model</title>
<desc id="d">Grouped bar chart on the same fresh long-form corpus. The 113 writing rules detect 45.1 percent of AI writing while wrongly flagging 24.8 percent of human writing, roughly one human document in four. The cycle-2 trained model detects 90.3 percent while wrongly flagging 1.34 percent. The rules are worse on both axes at once, which is why on 28 August 2026 they stopped contributing to the AI verdict and became editorial writing suggestions only.</desc><text x="0" y="26" font-size="16" font-weight="700" text-anchor="start" fill="#6e7781" fill-opacity="1">Why the hand-written writing rules stopped counting</text><text x="0" y="47" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">Same fresh long-form corpus · rules on 922 AI and 1,200 human documents · model on 922 AI and 4,636 human (browser runtime, pre-segmentation)</text><rect x="0" y="66" width="11" height="11" fill="#e5534b" rx="2"/><text x="17" y="76" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">113 writing-signal rules</text><rect x="200" y="66" width="11" height="11" fill="#2f81f7" rx="2"/><text x="217" y="76" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">cycle-2 trained model</text><line x1="76" y1="254.0" x2="820" y2="254.0" stroke="#6e7781" stroke-opacity="0.28"/><text x="66" y="258" font-size="11" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.95">0%</text><line x1="76" y1="218.0" x2="820" y2="218.0" stroke="#6e7781" stroke-opacity="0.28"/><text x="66" y="222" font-size="11" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.95">25%</text><line x1="76" y1="182.0" x2="820" y2="182.0" stroke="#6e7781" stroke-opacity="0.28"/><text x="66" y="186" font-size="11" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.95">50%</text><line x1="76" y1="146.0" x2="820" y2="146.0" stroke="#6e7781" stroke-opacity="0.28"/><text x="66" y="150" font-size="11" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.95">75%</text><line x1="76" y1="110.0" x2="820" y2="110.0" stroke="#6e7781" stroke-opacity="0.28"/><text x="66" y="114" font-size="11" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.95">100%</text><rect x="150.0" y="189.1" width="104" height="64.9" fill="#e5534b" rx="1.5"/><text x="202" y="181.05599999999998" font-size="15" font-weight="700" text-anchor="middle" fill="#6e7781" fill-opacity="1">45.1%</text><rect x="270.0" y="124.0" width="104" height="130.0" fill="#2f81f7" rx="1.5"/><text x="322" y="115.96799999999999" font-size="15" font-weight="700" text-anchor="middle" fill="#6e7781" fill-opacity="1">90.3%</text><text x="262" y="276" font-size="13" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">AI documents detected</text><text x="262" y="292" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.9">higher is better</text><rect x="522.0" y="218.3" width="104" height="35.7" fill="#e5534b" rx="1.5"/><text x="574" y="210.288" font-size="15" font-weight="700" text-anchor="middle" fill="#6e7781" fill-opacity="1">24.8%</text><rect x="642.0" y="252.1" width="104" height="2.0" fill="#2f81f7" rx="1.5"/><text x="694" y="244.0704" font-size="15" font-weight="700" text-anchor="middle" fill="#6e7781" fill-opacity="1">1.34%</text><text x="634" y="276" font-size="13" font-weight="600" text-anchor="middle" fill="#6e7781" fill-opacity="1">human documents wrongly flagged</text><text x="634" y="292" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.9">lower is better</text><line x1="76" y1="254" x2="820" y2="254" stroke="#6e7781" stroke-opacity="0.6"/><text x="16" y="182" transform="rotate(-90 16 182)" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="1">share of documents (%)</text><text x="430" y="326" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="1">The rules lose on both axes at once, so adding them to the verdict could only make it worse.</text></svg>
