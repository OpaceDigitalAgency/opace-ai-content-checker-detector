<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 414" width="860" height="414" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Detection by long-form category, shipped model against the cycle-2 model</title>
<desc id="d">Grouped horizontal bar chart at a 2 percent false-positive budget on 6,183 held-out rows, 1,220 AI and 4,963 human, that neither model had seen. Company updates went from 4.5 percent to 100 percent, 110 of 110. Marketing and SEO copy 35.9 to 98.0 percent, 194 of 198. Stories 0.0 to 88.8 percent, 301 of 339. Academic essays, literature reviews and discussion 0.0 to 79.4 percent, 139 of 175. Blog posts and articles 16.1 to 77.8 percent, 140 of 180. White papers and research documents 0.7 to 57.8 percent, 82 of 142. The old model failed three of the six categories outright at zero or near zero; the retrained model clears the 50 percent acceptance floor in every one.</desc><text x="0" y="26" font-size="16" font-weight="700" text-anchor="start" fill="#6e7781" fill-opacity="1">Retraining, per long-form category</text><text x="0" y="47" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">Detection at a 2% false-positive budget · 6,183 held-out rows (1,220 AI, 4,963 human) neither model had seen · cycle2-train</text><rect x="0" y="62" width="11" height="11" fill="#9198a1" rx="2"/><text x="17" y="72" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">shipped model (superseded)</text><rect x="220" y="62" width="11" height="11" fill="#2f81f7" rx="2"/><text x="237" y="72" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">cycle-2 model (deployed 28 August 2026)</text><line x1="274.0" y1="104" x2="274.0" y2="312" stroke="#6e7781" stroke-opacity="0.28"/><text x="274" y="330" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">0%</text><line x1="366.4" y1="104" x2="366.4" y2="312" stroke="#6e7781" stroke-opacity="0.28"/><text x="366.4" y="330" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">20%</text><line x1="458.8" y1="104" x2="458.8" y2="312" stroke="#6e7781" stroke-opacity="0.28"/><text x="458.8" y="330" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">40%</text><line x1="551.2" y1="104" x2="551.2" y2="312" stroke="#6e7781" stroke-opacity="0.28"/><text x="551.2" y="330" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">60%</text><line x1="643.6" y1="104" x2="643.6" y2="312" stroke="#6e7781" stroke-opacity="0.28"/><text x="643.6" y="330" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">80%</text><line x1="736.0" y1="104" x2="736.0" y2="312" stroke="#6e7781" stroke-opacity="0.28"/><text x="736" y="330" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">100%</text><text x="262" y="131" font-size="12.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">company updates, case studies, releases</text><text x="262" y="144" font-size="10.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.85">n = 110 AI documents</text><rect x="274" y="119" width="20.8" height="12" fill="#9198a1" rx="1.5"/><text x="300.79" y="129" font-size="10.5" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="0.9">4.5%</text><rect x="274" y="133" width="462.0" height="12" fill="#2f81f7" rx="1.5"/><text x="742" y="143" font-size="11" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">100.0%  (110/110)</text><text x="262" y="165" font-size="12.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">marketing and SEO copy</text><text x="262" y="178" font-size="10.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.85">n = 198 AI documents</text><rect x="274" y="153" width="165.9" height="12" fill="#9198a1" rx="1.5"/><text x="445.858" y="163" font-size="10.5" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="0.9">35.9%</text><rect x="274" y="167" width="452.8" height="12" fill="#2f81f7" rx="1.5"/><text x="732.76" y="177" font-size="11" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">98.0%  (194/198)</text><text x="262" y="199" font-size="12.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">stories and creative long-form</text><text x="262" y="212" font-size="10.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.85">n = 339 AI documents</text><rect x="274" y="187" width="1.5" height="12" fill="#9198a1" rx="1.5"/><text x="281.5" y="197" font-size="10.5" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="0.9">0.0%</text><rect x="274" y="201" width="410.3" height="12" fill="#2f81f7" rx="1.5"/><text x="690.2560000000001" y="211" font-size="11" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">88.8%  (301/339)</text><text x="262" y="233" font-size="12.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">academic essays, lit reviews, discussion</text><text x="262" y="246" font-size="10.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.85">n = 175 AI documents</text><rect x="274" y="221" width="1.5" height="12" fill="#9198a1" rx="1.5"/><text x="281.5" y="231" font-size="10.5" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="0.9">0.0%</text><rect x="274" y="235" width="366.8" height="12" fill="#2f81f7" rx="1.5"/><text x="646.828" y="245" font-size="11" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">79.4%  (139/175)</text><text x="262" y="267" font-size="12.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">blog posts and articles</text><text x="262" y="280" font-size="10.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.85">n = 180 AI documents</text><rect x="274" y="255" width="74.4" height="12" fill="#9198a1" rx="1.5"/><text x="354.382" y="265" font-size="10.5" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="0.9">16.1%</text><rect x="274" y="269" width="359.4" height="12" fill="#2f81f7" rx="1.5"/><text x="639.436" y="279" font-size="11" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">77.8%  (140/180)</text><text x="262" y="301" font-size="12.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">white papers and research documents</text><text x="262" y="314" font-size="10.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="0.85">n = 142 AI documents</text><rect x="274" y="289" width="3.2" height="12" fill="#9198a1" rx="1.5"/><text x="283.234" y="299" font-size="10.5" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="0.9">0.7%</text><rect x="274" y="303" width="267.0" height="12" fill="#2f81f7" rx="1.5"/><text x="547.0360000000001" y="313" font-size="11" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">57.8%  (82/142)</text><line x1="505.0" y1="98" x2="505.0" y2="314" stroke="#d29922" stroke-width="2" stroke-dasharray="5 4"/><text x="505" y="90" font-size="12" font-weight="700" text-anchor="middle" fill="#d29922" fill-opacity="1">50% acceptance floor</text><text x="505" y="400" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="1">share of AI documents in that category detected (%)</text></svg>
