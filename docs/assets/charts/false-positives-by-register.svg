<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 458" width="860" height="458" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Human documents wrongly flagged as AI, by register</title>
<desc id="d">Horizontal bar chart of the false-positive rate on 4,636 held-out human long-form documents, fp32 reference route, segments-v2, threshold 0.980. Human stories are the worst case at 33 of 260, 12.69 percent, roughly one story in eight. Academic discussion 16 of 420, 3.81 percent; academic conclusions 10 of 360, 2.78 percent; academic introductions 8 of 420, 1.90 percent; research summaries 3 of 189, 1.59 percent; long-form journalism 13 of 840, 1.55 percent; white papers 11 of 840, 1.31 percent; company updates 3 of 662, 0.45 percent; academic literature reviews 0 of 225 and student essays 0 of 420, both zero. Overall 97 of 4,636, 2.09 percent.</desc><text x="0" y="26" font-size="16" font-weight="700" text-anchor="start" fill="#6e7781" fill-opacity="1">Human documents wrongly flagged as AI, by register</text><text x="0" y="47" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">4,636 held-out human long-form documents · fp32 reference route · segments-v2 · threshold 0.980 · overall 97/4,636 = 2.09%</text><line x1="236.0" y1="86" x2="236.0" y2="388" stroke="#6e7781" stroke-opacity="0.28"/><text x="236" y="406" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">0%</text><line x1="395.3" y1="86" x2="395.3" y2="388" stroke="#6e7781" stroke-opacity="0.28"/><text x="395.3333333333333" y="406" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">5%</text><line x1="554.7" y1="86" x2="554.7" y2="388" stroke="#6e7781" stroke-opacity="0.28"/><text x="554.6666666666666" y="406" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">10%</text><line x1="714.0" y1="86" x2="714.0" y2="388" stroke="#6e7781" stroke-opacity="0.28"/><text x="714" y="406" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">15%</text><text x="224" y="109" font-size="13" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">stories  ← worst case</text><rect x="236" y="96" width="404.4" height="17" fill="#e5534b" rx="1.5"/><text x="648.3879999999999" y="109" font-size="12" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">12.69%  (33/260)</text><text x="224" y="139" font-size="13" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">academic discussion</text><rect x="236" y="126" width="121.4" height="17" fill="#9198a1" rx="1.5"/><text x="365.41200000000003" y="139" font-size="12" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">3.81%  (16/420)</text><text x="224" y="169" font-size="13" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">academic conclusions</text><rect x="236" y="156" width="88.6" height="17" fill="#9198a1" rx="1.5"/><text x="332.58933333333334" y="169" font-size="12" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">2.78%  (10/360)</text><text x="224" y="199" font-size="13" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">academic introductions</text><rect x="236" y="186" width="60.5" height="17" fill="#9198a1" rx="1.5"/><text x="304.5466666666667" y="199" font-size="12" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">1.90%  (8/420)</text><text x="224" y="229" font-size="13" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">research summaries</text><rect x="236" y="216" width="50.7" height="17" fill="#9198a1" rx="1.5"/><text x="294.668" y="229" font-size="12" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">1.59%  (3/189)</text><text x="224" y="259" font-size="13" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">long-form journalism</text><rect x="236" y="246" width="49.4" height="17" fill="#9198a1" rx="1.5"/><text x="293.3933333333333" y="259" font-size="12" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">1.55%  (13/840)</text><text x="224" y="289" font-size="13" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">white papers</text><rect x="236" y="276" width="41.7" height="17" fill="#9198a1" rx="1.5"/><text x="285.74533333333335" y="289" font-size="12" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">1.31%  (11/840)</text><text x="224" y="319" font-size="13" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">company updates</text><rect x="236" y="306" width="14.3" height="17" fill="#9198a1" rx="1.5"/><text x="258.34000000000003" y="319" font-size="12" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">0.45%  (3/662)</text><text x="224" y="349" font-size="13" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">academic literature reviews</text><rect x="236" y="336" width="0.0" height="17" fill="#9198a1" rx="1.5"/><rect x="236" y="336" width="2" height="17" fill="#9198a1" fill-opacity="0.45"/><text x="244" y="349" font-size="12" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">0%  (0/225)</text><text x="224" y="379" font-size="13" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">student essays</text><rect x="236" y="366" width="0.0" height="17" fill="#9198a1" rx="1.5"/><rect x="236" y="366" width="2" height="17" fill="#9198a1" fill-opacity="0.45"/><text x="244" y="379" font-size="12" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">0%  (0/420)</text><text x="475" y="444" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="1">share of genuine human documents in that register that were wrongly flagged (%)</text></svg>
