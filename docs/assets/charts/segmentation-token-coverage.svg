<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Token truncation before and after the segments-v2 segmentation fix</title>
<desc id="d">Grouped horizontal bar chart. Under the segments-v1 340-word rule, 1,348 of 23,318 segments, 5.78 percent, exceeded the 512-token window and had their ends silently dropped; this affected 684 of 5,558 documents, 12.31 percent, and 276,466 of 9,287,413 tokens, 2.98 percent, with a worst single segment of 3,406 tokens. Under segments-v2 all three counts are zero: 0 of 21,093 segments, 0 of 5,558 documents, 0 tokens. Recovering the dropped text changed no verdict on this corpus.</desc><text x="0" y="26" font-size="16" font-weight="700" text-anchor="start" fill="#6e7781" fill-opacity="1">Text the model never saw, before and after segments-v2</text><text x="0" y="47" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">Same 5,558-document fresh long-form corpus · TypeScript and Python segmenters agree on every segment of all 5,558 documents</text><rect x="0" y="62" width="11" height="11" fill="#e5534b" rx="2"/><text x="17" y="72" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">segments-v1 (340-word rule)</text><rect x="230" y="62" width="11" height="11" fill="#2f81f7" rx="2"/><text x="247" y="72" font-size="12" font-weight="400" text-anchor="start" fill="#6e7781" fill-opacity="1">segments-v2 (token-bounded, 29 August 2026)</text><line x1="290.0" y1="84" x2="290.0" y2="214" stroke="#6e7781" stroke-opacity="0.28"/><text x="290" y="232" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">0%</text><line x1="354.6" y1="84" x2="354.6" y2="214" stroke="#6e7781" stroke-opacity="0.28"/><text x="354.57142857142856" y="232" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">2%</text><line x1="419.1" y1="84" x2="419.1" y2="214" stroke="#6e7781" stroke-opacity="0.28"/><text x="419.1428571428571" y="232" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">4%</text><line x1="483.7" y1="84" x2="483.7" y2="214" stroke="#6e7781" stroke-opacity="0.28"/><text x="483.71428571428567" y="232" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">6%</text><line x1="548.3" y1="84" x2="548.3" y2="214" stroke="#6e7781" stroke-opacity="0.28"/><text x="548.2857142857142" y="232" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">8%</text><line x1="612.9" y1="84" x2="612.9" y2="214" stroke="#6e7781" stroke-opacity="0.28"/><text x="612.8571428571429" y="232" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">10%</text><line x1="677.4" y1="84" x2="677.4" y2="214" stroke="#6e7781" stroke-opacity="0.28"/><text x="677.4285714285713" y="232" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">12%</text><line x1="742.0" y1="84" x2="742.0" y2="214" stroke="#6e7781" stroke-opacity="0.28"/><text x="742" y="232" font-size="11" font-weight="400" text-anchor="middle" fill="#6e7781" fill-opacity="0.95">14%</text><text x="278" y="112" font-size="12.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">segments over the 512-token window</text><rect x="290" y="96" width="186.6" height="14" fill="#e5534b" rx="1.5"/><text x="483.6114285714286" y="107" font-size="11" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">5.78%  (1,348 of 23,318)</text><rect x="290" y="113" width="2.5" height="14" fill="#2f81f7" rx="1"/><text x="300" y="124" font-size="11" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">0%  (0 of 21,093)</text><text x="278" y="156" font-size="12.5" font-weight="400" text-anchor="end" fill="#6e7781" fill-opacity="1">documents with their ends silently dropped</text><rect x="290" y="140" width="397.4" height="14" fill="#e5534b" rx="1.5"/><text x="694.4371428571428" y="151" font-size="11" font-weight="600" text-anchor="start" fill="#6e7781" fill-opacity="1">12.31%  (684 of 5,558)<