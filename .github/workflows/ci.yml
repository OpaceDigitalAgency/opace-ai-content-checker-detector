name: validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: python -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r requirements-dev.lock
      - run: npm run test:all

  developer-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: |
          for package in contracts core browser client cli; do
            npm --prefix "packages/$package" ci
            npm --prefix "packages/$package" test
          done
      - run: node scripts/pack-public-developer-candidate.mjs dist/ci-public-npm

  astro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: packages/astro/package-lock.json
      - run: npm --prefix packages/astro ci --ignore-scripts
      - run: npm --prefix packages/astro test
      - run: npm --prefix packages/astro run check
      - run: npm --prefix packages/astro audit --audit-level=high

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/local-engine/requirements.lock
      - run: python -m pip install --require-hashes -r services/local-engine/requirements.lock
      - run: python -m pip install build==1.3.0 twine==7.0.0
      - run: PYTHONPATH=services/local-engine/src python -m unittest discover -s services/local-engine/tests -p 'test_*.py'
      - run: python -m build --wheel --sdist --outdir dist/ci
        working-directory: services/local-engine
      - run: python -m twine check services/local-engine/dist/ci/*

  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extensions/chrome/package-lock.json
      - run: npm --prefix extensions/chrome ci --ignore-scripts
      - run: npm --prefix extensions/chrome test
      - run: npm --prefix extensions/chrome run build
      - run: npm --prefix extensions/chrome run package
      - run: cmp extensions/chrome/artifacts/opace-ai-content-integrity-chrome-1.0.0.zip extensions/submission/chrome-web-store/package/opace-ai-content-integrity-chrome-1.0.0.zip
      - run: node extensions/submission/chrome-web-store/validate-submission.mjs
      - run: npm --prefix extensions/chrome audit --audit-level=high

  wordpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wordpress/opace-ai-content-integrity/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.8.12
      - run: npm --prefix wordpress/opace-ai-content-integrity ci --ignore-scripts
      - run: npm --prefix wordpress/opace-ai-content-integrity run lint
      - run: npm --prefix wordpress/opace-ai-content-integrity test
      - run: npm --prefix wordpress/opace-ai-content-integrity run test:e2e
      - run: composer --working-dir=wordpress/opace-ai-content-integrity validate --strict --no-check-all
      - run: composer --working-dir=wordpress/opace-ai-content-integrity install --prefer-dist --no-interaction --no-progress
      - run: composer --working-dir=wordpress/opace-ai-content-integrity run lint
      - run: composer --working-dir=wordpress/opace-ai-content-integrity run test
      - run: mkdir -p dist/ci-wordpress && bash wordpress/opace-ai-content-integrity/bin/build-plugin.sh dist/ci-wordpress
      - name: Verify the exact frozen WordPress candidate
        run: |
          version="$(node -p "require('./wordpress/opace-ai-content-integrity/package.json').version")"
          candidate="dist/ci-wordpress/opace-ai-content-integrity-${version}.zip"
          expected_file="wordpress/opace-ai-content-integrity/tests/evidence/g4/${version}/EXPECTED-SHA256.txt"
          test -f "$candidate"
          test -f "$expected_file"
          expected="$(awk 'NF { print $1; exit }' "$expected_file")"
          actual="$(sha256sum "$candidate" | awk '{ print $1 }')"
          test "$actual" = "$expected"
