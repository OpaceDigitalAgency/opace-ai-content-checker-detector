name: Bug report
description: Report a reproducible product defect without private content or secrets.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source text or customer data. Use the security policy for vulnerabilities.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Astro integration, Chrome extension, WordPress plugin, Node CLI, Local engine, Contracts or core, Benchmark mechanics]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Exact version
      placeholder: "For example: @opace/astro-content-integrity 0.1.0, Astro 7.2.7, Node 22.20.0"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal content-free reproduction
      description: List the smallest steps and use synthetic text only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, private source text, customer data and local filesystem paths.
          required: true
